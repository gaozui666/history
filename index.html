<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>六人定律 · 名人关系链</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07090f;
            --bg-mid: #10131f;
            --surface: rgba(15, 18, 30, 0.86);
            --surface-soft: rgba(255, 255, 255, 0.045);
            --hairline: rgba(214, 186, 138, 0.16);
            --ink: #e9e2cf;
            --ink-dim: #a49d8c;
            --muted: #6e7180;
            --gold: #d4a24e;
            --gold-soft: #ecd3a0;
            --seal: #b3432b;
            --seal-soft: #d16b4c;
            --jade: #4f8c7f;
            --jade-soft: #7db3a4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background:
                radial-gradient(circle at 15% 10%, rgba(79, 140, 127, 0.08), transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(179, 67, 43, 0.07), transparent 45%),
                linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            color: var(--ink);
        }

        .container {
            width: 100%;
            max-width: 1300px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--hairline);
            padding: 2.2rem 2.2rem 1.8rem;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 28px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.4rem;
            margin-bottom: 1.6rem;
            padding-bottom: 1.4rem;
            border-bottom: 1px solid var(--hairline);
        }

        .title-block { display: flex; align-items: center; gap: 0.9rem; }

        .seal-mark {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            background: linear-gradient(155deg, var(--seal), #8f3220);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-4deg);
            box-shadow: 0 6px 16px rgba(179, 67, 43, 0.35);
        }
        .seal-mark span {
            font-family: 'Noto Serif SC', serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: #f3e6d2;
        }

        .title-text h1 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
            font-size: 1.7rem;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #f3ead4, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }
        .title-text .tagline {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 0.95rem;
            color: var(--jade-soft);
            letter-spacing: 1px;
            margin-top: 0.1rem;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--surface-soft);
            border: 1px solid var(--hairline);
            border-radius: 999px;
            padding: 8px 10px;
        }
        .input-group input {
            background: transparent;
            border: none;
            color: var(--ink);
            padding: 6px 10px;
            font-size: 0.92rem;
            font-family: 'Noto Sans SC', sans-serif;
            outline: none;
            width: 130px;
        }
        .input-group input::placeholder { color: var(--muted); }
        .input-group .divider {
            color: var(--gold);
            font-size: 1rem;
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(155deg, var(--seal-soft), var(--seal));
            border: 1px solid rgba(255,255,255,0.12);
            color: #f5e9db;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 600;
            padding: 9px 22px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            white-space: nowrap;
        }
        .btn:hover { box-shadow: 0 10px 24px rgba(179, 67, 43, 0.4); transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(0.97); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

        .gear-btn {
            background: var(--surface-soft);
            border: 1px solid var(--hairline);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            color: var(--gold-soft);
            transition: 0.2s;
            flex-shrink: 0;
        }
        .gear-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: rotate(60deg);
            border-color: var(--gold);
        }
        .gear-btn.has-key {
            border-color: var(--jade);
            box-shadow: 0 0 16px rgba(79, 140, 127, 0.2);
        }

        .stats {
            display: flex;
            gap: 1.2rem;
            font-size: 0.82rem;
            color: var(--ink-dim);
            flex-wrap: wrap;
        }
        .stats b { color: var(--gold-soft); font-weight: 700; font-size: 1rem; }

        /* 思考过程 & Token 信息条 */
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.2rem 2rem;
            padding: 0.6rem 1rem;
            margin-bottom: 0.8rem;
            background: var(--surface-soft);
            border-radius: 14px;
            border: 1px solid var(--hairline);
            font-size: 0.82rem;
            color: var(--ink-dim);
            min-height: 44px;
            transition: 0.3s;
        }
        .info-bar .thinking {
            flex: 1;
            min-width: 140px;
            color: var(--gold-soft);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-bar .thinking .dots::after {
            content: '...';
            animation: dotPulse 1.2s steps(3, end) infinite;
        }
        @keyframes dotPulse {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }
        .info-bar .token-info {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }
        .info-bar .token-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .info-bar .token-info .num {
            color: var(--ink);
            font-weight: 600;
            font-family: 'Noto Sans SC', monospace;
        }
        .info-bar .token-info .label {
            color: var(--muted);
        }

        #chart {
            width: 100%;
            min-height: 550px;
            background:
                radial-gradient(circle at 1px 1px, rgba(214, 186, 138, 0.14) 1px, transparent 1.6px),
                radial-gradient(circle at 60% 40%, rgba(79, 140, 127, 0.06), transparent 55%),
                #0a0d17;
            background-size: 26px 26px, 100% 100%, 100% 100%;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            cursor: grab;
            position: relative;
            overflow: hidden;
        }
        #chart:active { cursor: grabbing; }
        svg { width: 100%; height: 100%; display: block; }

        .node circle.main { stroke-width: 2.5px; cursor: pointer; transition: filter 0.2s, stroke-width 0.2s; }
        .node circle.seal-ring { fill: none; stroke: var(--seal-soft); stroke-width: 1.4px; stroke-dasharray: 2 3; opacity: 0.85; }
        .node text {
            fill: var(--ink);
            font-family: 'Noto Sans SC', sans-serif;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
        .node text.endpoint-label { font-family: 'Noto Serif SC', serif; fill: var(--gold-soft); }

        .link { stroke: var(--jade); stroke-width: 2px; stroke-opacity: 0.75; }
        .link-label-bg {
            fill: rgba(10, 13, 23, 0.85);
            stroke: var(--hairline);
            stroke-width: 1px;
        }
        .link-label { fill: var(--gold-soft); font-size: 10.5px; font-weight: 600; text-anchor: middle; }

        .tooltip {
            position: absolute;
            background: linear-gradient(165deg, rgba(24, 22, 30, 0.97), rgba(15, 15, 22, 0.97));
            border: 1px solid var(--hairline);
            border-top: 2px solid var(--seal);
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            color: var(--ink);
            pointer-events: none;
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.65);
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 100;
            max-width: 260px;
        }
        .tooltip strong {
            font-family: 'Noto Serif SC', serif;
            color: var(--gold-soft);
            font-size: 1.05rem;
            display: block;
        }
        .tooltip .era { color: var(--jade-soft); font-size: 0.75rem; letter-spacing: 0.5px; }
        .tooltip p { margin-top: 0.4rem; font-size: 0.85rem; color: var(--ink-dim); line-height: 1.5; }

        .loading-box {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--gold-soft);
            font-size: 1rem;
            padding: 1rem;
            height: 100%;
            min-height: 550px;
            justify-content: center;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 1px;
        }
        .spinner {
            width: 26px;
            height: 26px;
            border: 2.5px solid var(--seal-soft);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            color: var(--seal-soft);
            text-align: center;
            padding: 3rem 1rem;
            font-size: 1rem;
            font-family: 'Noto Serif SC', serif;
        }

        .placeholder-text {
            color: var(--muted);
            text-align: center;
            padding-top: 230px;
            font-size: 0.95rem;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 1px;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-box {
            background: linear-gradient(160deg, #161a28, #0e111e);
            border: 1px solid var(--hairline);
            border-radius: 24px;
            padding: 2.4rem 2.8rem;
            max-width: 460px;
            width: 92%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
        }
        .modal-box h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.3rem;
            color: var(--gold-soft);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-box .hint {
            color: var(--ink-dim);
            font-size: 0.85rem;
            margin-bottom: 1.4rem;
            line-height: 1.6;
        }
        .modal-box input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--hairline);
            border-radius: 12px;
            color: var(--ink);
            font-size: 0.95rem;
            font-family: 'Noto Sans SC', sans-serif;
            outline: none;
            transition: 0.2s;
        }
        .modal-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 162, 78, 0.1);
        }
        .modal-box input::placeholder { color: var(--muted); }
        .modal-box .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 1.6rem;
            justify-content: flex-end;
        }
        .modal-box .modal-actions .btn {
            padding: 10px 28px;
        }
        .modal-box .modal-actions .btn-secondary {
            background: transparent;
            border: 1px solid var(--hairline);
            color: var(--ink-dim);
        }
        .modal-box .modal-actions .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            box-shadow: none;
        }
        .modal-box .key-status {
            margin-top: 0.8rem;
            font-size: 0.78rem;
            color: var(--jade-soft);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 720px) {
            .container { padding: 1.4rem 1.2rem; border-radius: 20px; }
            .header { flex-direction: column; align-items: stretch; }
            .right-section { width: 100%; justify-content: space-between; }
            .controls { align-items: stretch; width: 100%; }
            .input-group { flex-wrap: wrap; justify-content: center; border-radius: 20px; }
            .input-group input { width: 100px; }
            .stats { justify-content: center; }
            #chart { min-height: 440px; }
            .placeholder-text { padding-top: 170px; }
            .modal-box { padding: 1.8rem 1.4rem; }
            .info-bar { flex-direction: column; align-items: stretch; gap: 0.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-block">
                <div class="seal-mark"><span>链</span></div>
                <div class="title-text">
                    <h1>六人定律 · 名人关系链</h1>
                    <div class="tagline">经纬相牵，天下无远人</div>
                </div>
            </div>
            <div class="right-section">
                <div class="controls">
                    <div class="input-group">
                        <input type="text" id="startPerson" placeholder="起点名人">
                        <span class="divider">→</span>
                        <input type="text" id="endPerson" placeholder="终点名人">
                        <button class="btn" id="generateBtn" onclick="handleGenerate()">生成关系链</button>
                    </div>
                    <div class="stats">
                        <span>节点 <b id="nodeCount">0</b></span>
                        <span>步数 <b id="linkCount">0</b></span>
                    </div>
                </div>
                <button class="gear-btn" id="gearBtn" title="设置 API Key">⚙️</button>
            </div>
        </div>

        <!-- 思考过程 & Token 信息 -->
        <div class="info-bar" id="infoBar">
            <div class="thinking" id="thinkingDisplay">
                <span>💭</span>
                <span id="thinkingText">等待生成…</span>
            </div>
            <div class="token-info">
                <span><span class="label">📥 输入</span> <span class="num" id="promptTokens">-</span></span>
                <span><span class="label">📤 输出</span> <span class="num" id="completionTokens">-</span></span>
                <span><span class="label">🔢 总计</span> <span class="num" id="totalTokens">-</span></span>
            </div>
        </div>

        <div id="chart">
            <p class="placeholder-text" id="placeholder">输入两位名人，点击「生成关系链」追溯他们之间的六人之链</p>
        </div>
    </div>
    <div class="tooltip" id="tooltip"></div>

    <script>
        // ---------- 缓存管理 ----------
        const STORAGE_KEY = 'six_degrees_api_key';

        function loadApiKey() {
            return localStorage.getItem(STORAGE_KEY) || '';
        }

        function saveApiKey(key) {
            if (key && key.trim()) {
                localStorage.setItem(STORAGE_KEY, key.trim());
            } else {
                localStorage.removeItem(STORAGE_KEY);
            }
            updateGearStatus();
        }

        function getApiKey() {
            return loadApiKey();
        }

        function updateGearStatus() {
            const gear = document.getElementById('gearBtn');
            const hasKey = !!loadApiKey();
            gear.classList.toggle('has-key', hasKey);
            gear.title = hasKey ? '已设置 API Key，点击修改' : '点击设置 API Key';
        }

        // ---------- 弹窗 ----------
        function showApiKeyModal(onSave) {
            const existing = document.querySelector('.modal-overlay');
            if (existing) existing.remove();

            const currentKey = loadApiKey();

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <h2>🔑 设置 DeepSeek API Key</h2>
                    <div class="hint">
                        请输入你的 DeepSeek API Key。密钥将保存在浏览器本地缓存中。
                        <br><span style="color: var(--muted); font-size: 0.8rem;">获取地址：<a href="https://platform.deepseek.com/api_keys" target="_blank" style="color: var(--jade-soft);">platform.deepseek.com</a></span>
                    </div>
                    <input type="password" id="modalApiInput" placeholder="sk-..." value="${currentKey}">
                    <div class="key-status" id="modalKeyStatus">
                        ${currentKey ? '✅ 已保存密钥（点击「保存」可更新）' : '⚠️ 尚未保存密钥'}
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" id="modalCancelBtn">取消</button>
                        <button class="btn" id="modalSaveBtn">保存</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const input = overlay.querySelector('#modalApiInput');
            const saveBtn = overlay.querySelector('#modalSaveBtn');
            const cancelBtn = overlay.querySelector('#modalCancelBtn');
            const status = overlay.querySelector('#modalKeyStatus');

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveBtn.click();
            });

            saveBtn.addEventListener('click', () => {
                const val = input.value.trim();
                if (val) {
                    saveApiKey(val);
                    status.innerHTML = '✅ 密钥已保存';
                    status.style.color = 'var(--jade-soft)';
                    if (onSave) onSave(val);
                    setTimeout(() => overlay.remove(), 400);
                } else {
                    status.innerHTML = '⚠️ 请输入有效的 API Key';
                    status.style.color = 'var(--seal-soft)';
                }
            });

            cancelBtn.addEventListener('click', () => {
                overlay.remove();
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });

            setTimeout(() => input.focus(), 150);
        }

        document.getElementById('gearBtn').addEventListener('click', () => {
            showApiKeyModal();
        });

        // ---------- 更新思考过程 & Token ----------
        function setThinking(text, isThinking = true) {
            const el = document.getElementById('thinkingText');
            if (isThinking) {
                el.innerHTML = text + ' <span class="dots"></span>';
            } else {
                el.textContent = text;
            }
        }

        function setTokens(prompt, completion, total) {
            document.getElementById('promptTokens').textContent = prompt !== undefined ? prompt : '-';
            document.getElementById('completionTokens').textContent = completion !== undefined ? completion : '-';
            document.getElementById('totalTokens').textContent = total !== undefined ? total : '-';
        }

        function resetInfoBar() {
            setThinking('等待生成…', false);
            setTokens('-', '-', '-');
        }

        // ---------- API 调用 ----------
        const API_URL = "https://api.deepseek.com/v1/chat/completions";

        function getPrompt(start, end) {
            return `请用"六人定律"连接"${start}"和"${end}"。通过5-7个真实存在的中间人物形成一条关系链。

要求：
1. 起点是"${start}"，终点是"${end}"
2. 每个中间人物必须真实存在
3. 关系必须真实有据（师生/朋友/合作/影响/血缘/共事等）
4. 严格返回纯JSON，不要markdown代码块，不要任何解释文字

JSON格式：
{
  "title": "从${start}到${end}的六人链",
  "nodes": [
    {"id": "1", "name": "${start}", "era": "朝代/年代", "desc": "一句话身份"},
    {"id": "2", "name": "中间人", "era": "朝代/年代", "desc": "一句话身份"},
    ...共6-8个节点
  ],
  "links": [
    {"source": "1", "target": "2", "relation": "师生"},
    {"source": "2", "target": "3", "relation": "朋友"},
    ...形成一条链，从1连到最后一个节点
  ]
}`;
        }

        async function fetchData(start, end, onProgress) {
            const apiKey = getApiKey();
            if (!apiKey) {
                throw new Error('请先设置 DeepSeek API Key');
            }

            const prompt = getPrompt(start, end);

            // 显示思考过程
            setThinking('正在分析人物关系，构建六人链…', true);
            setTokens('...', '...', '...');

            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.9,
                    max_tokens: 2000,
                    stream: false
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errText}`);
            }

            const data = await response.json();

            // 提取 token 信息
            const usage = data.usage || {};
            const promptTokens = usage.prompt_tokens;
            const completionTokens = usage.completion_tokens;
            const totalTokens = usage.total_tokens;

            setTokens(promptTokens, completionTokens, totalTokens);
            setThinking('✅ 关系链生成完成', false);

            let content = data.choices[0].message.content.trim();
            if (content.startsWith("```")) {
                content = content.replace(/```json?|```/g, "").trim();
            }
            return JSON.parse(content);
        }

        // ---------- 绘图 ----------
        function drawChart(chainData) {
            d3.select('#chart svg').remove();
            document.getElementById('loadingBox') && document.getElementById('loadingBox').remove();
            document.getElementById('placeholder').style.display = 'none';

            if (!chainData || !chainData.nodes || !chainData.links) {
                document.getElementById('chart').insertAdjacentHTML('beforeend',
                    '<div class="error-msg">生成失败，请检查网络或 API Key 后重试</div>');
                return;
            }

            document.getElementById('nodeCount').textContent = chainData.nodes.length;
            document.getElementById('linkCount').textContent = chainData.links.length;

            const container = document.getElementById('chart');
            const width = container.clientWidth;
            const height = 550;

            const svg = d3.select('#chart')
                .append('svg')
                .attr('viewBox', `0 0 ${width} ${height}`);

            const tooltip = d3.select('#tooltip');

            const colors = ['#d4a24e', '#c9944a', '#4f8c7f', '#5b6b94', '#8a5a7a', '#6f8c5f', '#b3432b', '#7d9db0'];

            const simulation = d3.forceSimulation(chainData.nodes)
                .force('link', d3.forceLink(chainData.links).id(d => d.id).distance(130))
                .force('charge', d3.forceManyBody().strength(-550))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(55));

            const g = svg.append('g');

            const linkGroup = g.append('g');
            const links = linkGroup.selectAll('line')
                .data(chainData.links)
                .join('line')
                .attr('class', 'link');

            const linkLabelGroup = linkGroup.selectAll('g.label-group')
                .data(chainData.links)
                .join('g')
                .attr('class', 'label-group');

            linkLabelGroup.append('rect')
                .attr('class', 'link-label-bg')
                .attr('rx', 6)
                .attr('height', 17);

            const linkLabelText = linkLabelGroup.append('text')
                .attr('class', 'link-label')
                .text(d => d.relation)
                .attr('dy', 4);

            linkLabelGroup.each(function() {
                const g = d3.select(this);
                const textNode = g.select('text').node();
                const bbox = textNode.getBBox();
                g.select('rect')
                    .attr('width', bbox.width + 14)
                    .attr('x', -(bbox.width + 14) / 2)
                    .attr('y', -12);
            });

            const nodeGroup = g.append('g');
            const nodes = nodeGroup.selectAll('g')
                .data(chainData.nodes)
                .join('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x;
                        d.fy = d.y;
                    })
                    .on('drag', (event, d) => {
                        d.fx = event.x;
                        d.fy = event.y;
                    })
                    .on('end', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0);
                        d.fx = null;
                        d.fy = null;
                    })
                );

            const lastId = String(chainData.nodes.length);
            const isEndpoint = d => d.id === '1' || d.id === lastId;

            nodes.filter(isEndpoint)
                .append('circle')
                .attr('class', 'seal-ring')
                .attr('r', 27);

            nodes.append('circle')
                .attr('class', 'main')
                .attr('r', d => isEndpoint(d) ? 21 : 18)
                .attr('fill', (d, i) => colors[i % colors.length])
                .attr('stroke', d => isEndpoint(d) ? '#f5e0c8' : '#e9e2cf')
                .attr('stroke-width', d => isEndpoint(d) ? 2.5 : 2)
                .on('mouseenter', function(event, d) {
                    tooltip.style('opacity', 1)
                        .html(`
                            <strong>${d.name}</strong>
                            <span class="era">${d.era || ''}</span>
                            <p>${d.desc || ''}</p>
                        `)
                        .style('left', (event.pageX + 20) + 'px')
                        .style('top', (event.pageY - 30) + 'px');
                    d3.select(this).attr('stroke', '#ffe7b3').attr('stroke-width', 4);
                })
                .on('mousemove', function(event) {
                    tooltip.style('left', (event.pageX + 20) + 'px')
                        .style('top', (event.pageY - 30) + 'px');
                })
                .on('mouseleave', function(event, d) {
                    tooltip.style('opacity', 0);
                    d3.select(this)
                        .attr('stroke', isEndpoint(d) ? '#f5e0c8' : '#e9e2cf')
                        .attr('stroke-width', isEndpoint(d) ? 2.5 : 2);
                });

            nodes.append('text')
                .text(d => d.name)
                .attr('class', d => isEndpoint(d) ? 'endpoint-label' : '')
                .attr('dy', d => isEndpoint(d) ? 40 : 32)
                .attr('font-size', d => isEndpoint(d) ? 15 : 12)
                .attr('font-weight', d => isEndpoint(d) ? 700 : 500);

            simulation.on('tick', () => {
                links
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                linkLabelGroup.attr('transform', d => `translate(${(d.source.x + d.target.x) / 2}, ${(d.source.y + d.target.y) / 2})`);

                nodes.attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }

        // ---------- 生成入口 ----------
        async function handleGenerate() {
            const start = document.getElementById('startPerson').value.trim();
            const end = document.getElementById('endPerson').value.trim();

            if (!start || !end) {
                alert('请输入两位名人');
                return;
            }

            // 重置信息栏
            resetInfoBar();

            let apiKey = getApiKey();
            if (!apiKey) {
                showApiKeyModal((newKey) => {
                    doGenerate(start, end);
                });
                return;
            }

            doGenerate(start, end);
        }

        async function doGenerate(start, end) {
            document.getElementById('placeholder').style.display = 'none';
            d3.select('#chart svg').remove();
            const oldError = document.querySelector('.error-msg');
            if (oldError) oldError.remove();

            const loadBox = document.createElement('div');
            loadBox.id = 'loadingBox';
            loadBox.className = 'loading-box';
            loadBox.innerHTML = '<div class="spinner"></div><span>正在追溯关系脉络…</span>';
            document.getElementById('chart').appendChild(loadBox);
            document.getElementById('generateBtn').disabled = true;

            try {
                const data = await fetchData(start, end);
                drawChart(data);
            } catch (err) {
                document.getElementById('loadingBox') && document.getElementById('loadingBox').remove();
                let msg = err.message || '未知错误';
                if (msg.includes('401') || msg.includes('403') || msg.includes('key')) {
                    msg = 'API Key 无效或已过期，请重新设置';
                    setThinking('❌ ' + msg, false);
                    setTimeout(() => showApiKeyModal(), 300);
                } else {
                    setThinking('❌ 生成失败: ' + msg, false);
                }
                document.getElementById('chart').insertAdjacentHTML('beforeend',
                    `<div class="error-msg">生成失败：${msg}</div>`);
            } finally {
                document.getElementById('generateBtn').disabled = false;
            }
        }

        // 暴露给全局
        window.handleGenerate = handleGenerate;

        // 页面加载时初始化
        updateGearStatus();
        resetInfoBar();
    </script>
</body>
</html>
